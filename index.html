<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nancy Spains — Department Progress</title>
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<style>
  /* ============================================================
     NANCY SPAINS — OFFICE WALL (auto-rotating + tap/swipe, LIVE)
     Reads data.json. Rotation: Overview -> each department ->
     Critical Success Factors -> Mission & Values.
     Brand: New Brand Guidelines (Nov 2026) — Ink / Reference Green /
     Gold / Cream (+ Red accent). Display type: Merchant Block Sans
     (caps). Copy type: Founders Grotesk.
     ============================================================ */
  @font-face{ font-family:'Merchant Block Sans'; src:url('brand/MerchantBlockSans.ttf') format('truetype');
    font-weight:400 700; font-display:swap; }
  :root{
    /* brand palette */
    --ink:#1F2421; --green:#48623F; --gold:#DDB32C; --cream:#F3E8CE; --red:#832926;
    /* derived */
    --panel:rgba(31,36,33,.55); --track:rgba(31,36,33,.6); --muted:rgba(243,232,206,.62);
    --rule:rgba(221,179,44,.35);
    /* status (functional, tuned to sit on Reference Green) */
    --done:#8FC46A; --working:#DDB32C; --stuck:#E0574D; --notstart:#A8A08A;
    --display:'Merchant Block Sans','Helvetica Neue',Arial,sans-serif;
    --copy:'Founders Grotesk','Founders Grotesk Regular','Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--green); color:var(--cream);
    font-family:var(--copy); overflow:hidden; -webkit-font-smoothing:antialiased; }
  .stage{ position:relative; height:100vh; width:100vw; cursor:pointer; }
  .slide{ display:none; position:absolute; inset:0; flex-direction:column; padding:4vh 4vw; }
  .slide.active{ display:flex; animation:fade .5s ease; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }

  .disp{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }

  .top{ display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom:2px solid var(--gold); padding-bottom:1.6vh; }
  .top .logo{ height:5.2vh; width:auto; display:block; }
  .top .rt{ text-align:right; }
  .top .rt h1{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    font-size:4.2vh; color:var(--gold); line-height:1; }
  .top .rt .sub{ font-size:2.0vh; color:var(--muted); margin-top:.8vh; letter-spacing:.18em; text-transform:uppercase; }

  /* overview */
  .board{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:2.2vh; }
  .ov-row{ display:grid; grid-template-columns:20vw 1fr auto; align-items:center; gap:2vw; padding:1.2vh 1vw; }
  .ov-name{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    font-size:3.2vh; color:var(--gold); }
  .ov-bar{ display:flex; height:2.6vh; border-radius:.6vh; overflow:hidden; gap:4px; background:transparent; }
  .ov-seg{ flex:1; }
  .ov-empty{ flex:1; background:var(--track); }
  .ov-sum{ font-size:2vh; color:var(--cream); white-space:nowrap; text-align:right; }
  .ov-sum .none{ color:var(--muted); font-style:italic; }

  /* department detail */
  .dept-name{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    font-size:6vh; color:var(--gold); margin:2vh 0 .4vh; line-height:1; }
  .dept-rock{ font-size:3.2vh; color:var(--cream); margin:.6vh 0 .3vh; }
  .dept-sub{ font-size:1.9vh; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; margin-bottom:1.8vh; }
  .pillars{ flex:1; display:flex; flex-direction:column; justify-content:flex-start; gap:1.2vh; }
  .pillar{ display:flex; align-items:center; gap:1.4vw; padding:1.6vh 1.4vw;
    background:var(--panel); border-left:4px solid var(--gold); border-radius:.4vh; }
  .pillar .dot{ width:1.8vh; height:1.8vh; border-radius:50%; flex:none; }
  .pillar .nm{ flex:1; font-size:3vh; color:var(--cream); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .st-pill{ flex:none; font-size:1.7vh; font-weight:bold; letter-spacing:.1em; text-transform:uppercase;
    padding:.7vh 1.4vw; border-radius:5vh; border:2px solid currentColor; }
  .empty{ color:var(--muted); font-style:italic; font-size:2.6vh; }
  /* 8+ pillars: tighten so the list fits on one screen */
  .pillars.compact{ gap:.8vh; }
  .pillars.compact .pillar{ padding:1.05vh 1.4vw; }
  .pillars.compact .nm{ font-size:2.5vh; }
  .pillars.compact .st-pill{ font-size:1.5vh; padding:.5vh 1.2vw; }

  /* critical success factors */
  .bhag{ text-align:center; padding:1.8vh 0 2.4vh; border-bottom:2px solid var(--rule); margin-bottom:2.4vh; }
  .bhag .lbl{ font-family:var(--display); font-weight:700; font-size:1.9vh; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
  .bhag .txt{ font-size:3.8vh; color:var(--cream); font-style:italic; line-height:1.3; margin-top:1.2vh; }
  .csf-head{ text-align:center; margin-bottom:2vh; }
  .csf-head .h{ font-family:var(--display); font-weight:700; font-size:2.8vh; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
  .csf-list{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:2vw; }
  .csf{ background:var(--panel); border-top:6px solid var(--gold); border-radius:.6vh;
    padding:2.6vh 1.6vw; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .csf .factor{ flex:1; display:flex; align-items:center; justify-content:center;
    font-size:4vh; color:var(--cream); line-height:1.25; margin:1.4vh 0; text-wrap:balance; }
  .csf .sponsor{ width:100%; padding-top:1.6vh; border-top:1px solid var(--rule); }
  .csf .sponsor .slabel{ display:block; font-size:1.4vh; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); margin-bottom:.5vh; }
  .csf .sponsor .sname{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:2.2vh; color:var(--cream); }

  /* mission */
  .mission{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:3.4vh; }
  .mission .mt{ font-family:var(--display); font-weight:700; font-size:2.6vh; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); }
  .mission .mtext{ font-size:5vh; color:var(--cream); max-width:78%; line-height:1.3; font-style:italic; text-wrap:balance; }
  .mission .vals{ display:flex; gap:1.8vw; flex-wrap:wrap; justify-content:center; align-items:center; }
  .mission .val{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:2.4vh; color:var(--gold); }
  .mission .sep{ color:var(--cream); opacity:.5; font-size:1.2vh; line-height:1; }

  .foot{ display:flex; align-items:center; justify-content:space-between;
    margin-top:1.4vh; padding-top:1.4vh; border-top:2px solid var(--gold); }
  .values{ font-size:1.7vh; letter-spacing:.14em; text-transform:uppercase; color:var(--cream); opacity:.85; }
  .dots{ display:flex; gap:8px; }
  .dots span{ width:10px; height:10px; border-radius:50%; background:var(--track); }
  .dots span.on{ background:var(--gold); }
  .updated{ font-size:1.6vh; color:var(--muted); }
  .updated b{ color:var(--cream); font-weight:normal; }
  .timer{ position:absolute; left:0; top:0; height:4px; background:var(--gold); width:0; z-index:5; }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="timer" id="timer"></div></div>

<script>
/* ---- editable: company values (footer + Mission slide) ---- */
const VALUES = ["Be an owner", "Superpumped", "Relentless ambition", "Earn your pint", "Customer obsessed"];
/* Mission statement */
const MISSION = "Bringing the craic, one tune, one pint, one city at a time.";
/* Big Hairy Audacious Goal + Critical Success Factors (edit here) */
const BHAG = "Nancy Spains will become the number one brand for Irish pubs and live music in the world!";
const CSFS = [
  { factor:"A limitless flow of great people.", sponsor:"Liz Jones" },
  { factor:"Every year bigger; every year better.", sponsor:"Nick O'Halloran" },
  { factor:"Turn every punter into a lifelong fan.", sponsor:"Rich Myers" }
];

const FALLBACK = { quarter:{label:"Q3 2026",sub:"Jul – Sep 2026"}, updated:"offline", departments:[] };
const LOGO = "brand/wordmark-gold.svg";
const PSTATUS = {
  notstart:{label:"Not Started",colour:"#A8A08A",seg:"rgba(243,232,206,.28)",word:"to start"},
  working:{label:"Working on it",colour:"#DDB32C",seg:"#DDB32C",word:"in progress"},
  stuck:{label:"Stuck",colour:"#E0574D",seg:"#E0574D",word:"stuck"},
  done:{label:"Done",colour:"#8FC46A",seg:"#8FC46A",word:"done"}
};
const DWELL_OV = 36000, DWELL_DEPT = 24000, DWELL_CSF = 24000, DWELL_MISSION = 24000;

const stage = document.getElementById('stage');
let idx = 0, iv = null, DATA = FALLBACK, dwells = [];

function cleanRock(name){ if(!name) return ''; return /add title here/i.test(name) ? 'Quarterly rock — to be set' : name; }
function topBar(mainRight, subRight){
  return `<div class="top"><img class="logo" src="${LOGO}" alt="Nancy Spains">
    <div class="rt"><h1>${mainRight}</h1><div class="sub">${subRight}</div></div></div>`;
}
function foot(i,total){
  let dots=''; for(let k=0;k<total;k++) dots+=`<span class="${k===i?'on':''}"></span>`;
  return `<div class="foot"><div class="values">${VALUES.join('  ·  ')}</div>
    <div class="dots">${dots}</div><div class="updated">Updated <b>${DATA.updated||'—'}</b></div></div>`;
}
function summary(pillars){
  const c={done:0,working:0,stuck:0,notstart:0};
  pillars.forEach(p=> c[p.status]!==undefined ? c[p.status]++ : c.notstart++);
  return ['done','working','stuck','notstart'].filter(k=>c[k]>0).map(k=>`${c[k]} ${PSTATUS[k].word}`).join('  ·  ');
}
function overviewSlide(deps,total,q){
  const rows = deps.map(d=>{
    const pillars=d.pillars||[];
    const bar = pillars.length
      ? pillars.map(p=>`<div class="ov-seg" style="background:${(PSTATUS[p.status]||PSTATUS.notstart).seg}"></div>`).join('')
      : `<div class="ov-empty"></div>`;
    const sum = pillars.length ? summary(pillars) : `<span class="none">No pillars yet</span>`;
    return `<div class="ov-row"><div class="ov-name">${d.dept}</div>
      <div class="ov-bar">${bar}</div><div class="ov-sum">${sum}</div></div>`;
  }).join('');
  return `<div class="slide">${topBar('Department Progress', q.label+' · '+q.sub)}
    <div class="board">${rows}</div>${foot(0,total)}</div>`;
}
function deptSlide(d,i,total,q){
  const done=(d.pillars||[]).filter(p=>p.status==='done').length;
  const body=(d.pillars&&d.pillars.length)
    ? d.pillars.map(p=>{const s=PSTATUS[p.status]||PSTATUS.notstart;
        return `<div class="pillar"><span class="dot" style="color:${s.colour};background:${s.colour}"></span>
          <span class="nm">${p.name}</span><span class="st-pill" style="color:${s.colour}">${s.label}</span></div>`;}).join('')
    : `<div class="empty">No pillars added yet.</div>`;
  return `<div class="slide">${topBar(q.label, q.sub)}
    <div class="dept-name">${d.dept}</div>
    <div class="dept-rock">${cleanRock(d.rock)}</div>
    <div class="dept-sub">${done} of ${(d.pillars||[]).length} pillars done</div>
    <div class="pillars${(d.pillars||[]).length>7?' compact':''}">${body}</div>${foot(i,total)}</div>`;
}
function csfSlide(i,total,q){
  const rows = CSFS.map(c=>`<div class="csf">
      <div class="factor">${c.factor}</div>
      <div class="sponsor"><span class="slabel">Board sponsor</span><span class="sname">${c.sponsor}</span></div>
    </div>`).join('');
  return `<div class="slide">${topBar('Critical Success Factors', q.label+' · '+q.sub)}
    <div class="bhag"><div class="lbl">Our Big Hairy Audacious Goal</div><div class="txt">${BHAG}</div></div>
    <div class="csf-head"><span class="h">Critical Success Factors</span></div>
    <div class="csf-list">${rows}</div>${foot(i,total)}</div>`;
}
function missionSlide(i,total,q){
  const vals = VALUES.map(v=>`<span class="val">${v}</span>`).join('<span class="sep">●</span>');
  return `<div class="slide">${topBar('Mission & Values', q.label+' · '+q.sub)}
    <div class="mission"><div class="mt">Our Mission</div>
      <div class="mtext">${MISSION}</div>
      <div class="vals">${vals}</div></div>${foot(i,total)}</div>`;
}
function build(){
  const q=DATA.quarter||FALLBACK.quarter;
  const deps=(DATA.departments||[]);
  const total=deps.length+3;   /* overview + departments + CSF + mission */
  dwells=[DWELL_OV].concat(deps.map(()=>DWELL_DEPT)).concat([DWELL_CSF, DWELL_MISSION]);
  let html='<div class="timer" id="timer"></div>';
  html+=overviewSlide(deps,total,q);
  deps.forEach((d,i)=> html+=deptSlide(d,i+1,total,q));
  html+=csfSlide(total-2,total,q);
  html+=missionSlide(total-1,total,q);
  stage.innerHTML=html;
  if(idx>=total) idx=0;
  show(idx);
}
function slides(){ return [...stage.querySelectorAll('.slide')]; }
function show(n){
  const S=slides(); if(!S.length) return;
  idx=(n+S.length)%S.length;
  S.forEach((s,i)=>s.classList.toggle('active', i===idx));
  const timer=document.getElementById('timer'), dw=dwells[idx]||DWELL_DEPT;
  if(timer){ timer.style.transition='none'; timer.style.width='0';
    requestAnimationFrame(()=>{ timer.style.transition=`width ${dw}ms linear`; timer.style.width='100%'; }); }
  clearTimeout(iv); iv=setTimeout(next, dw);
}
function next(){ show(idx+1); }
function go(n){ show(n); }

async function load(){
  try{ const res=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw 0; const j=await res.json(); if(j&&j.departments) DATA=j;
  }catch(e){}
  build();
}
load();
setInterval(load, 5*60*1000);
setTimeout(()=>location.reload(), 6*60*60*1000);

stage.addEventListener('click', ()=>go(idx+1));
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight')go(idx+1); if(e.key==='ArrowLeft')go(idx-1); });
let x0=null;
stage.addEventListener('touchstart', e=>x0=e.touches[0].clientX, {passive:true});
stage.addEventListener('touchend', e=>{ if(x0===null)return; const dx=e.changedTouches[0].clientX-x0;
  if(Math.abs(dx)>40) go(idx+(dx<0?1:-1)); x0=null; });
</script>
</body>
</html>
